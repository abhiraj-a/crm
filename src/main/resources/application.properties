spring.application.name=CRM

# ======================================================================
# DATABASE (PostgreSQL)
# ======================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ======================================================================
# EMAIL (Brevo Transactional API)
# ======================================================================
# Get your API key from: https://app.brevo.com/settings/keys/api
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@crm.app}
brevo.sender-name=${BREVO_SENDER_NAME:CRM App}

# ======================================================================
# ASYNC THREAD POOL
# ======================================================================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100


authifyer.jwks-url= https://authifyer-backend.onrender.com/authifyer/get/jwks
authifyer.issuer= https://authifyer-backend.onrender.com
